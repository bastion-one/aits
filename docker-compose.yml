services:
  postgres:
    image: postgres:16-alpine
    container_name: bastion-one-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bastion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bastion}
      POSTGRES_DB: ${POSTGRES_DB:-bastion}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bastion_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bastion} -d ${POSTGRES_DB:-bastion}"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  bastion_pg_data:
