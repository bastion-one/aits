[project]
name = "aits"
version = "0.3.0"
description = "Content-addressed ledger for AI agent configurations, inference records, and lineage"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.14.2",
    "fastapi>=0.137.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-multipart==0.0.31",
    # Exact pin: this library's output bytes are the ledger format. A version bump
    # can change CIDs, so it moves only deliberately, together with the golden vectors.
    "rfc8785==0.1.4",
    "sqlmodel>=0.0.38",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "fastapi-cli>=0.0.24",
    "httpx2>=2.4.0",
    "pylint==4.0.5",
    "pytest==9.0.3",
]
quality = [
    "coverage==7.16.0",
    "defusedxml>=0.7.1",
    "mutmut==3.7.0",
    "radon==6.0.1",
]
# NOTE: the generated SDK (aits-client) is deliberately NOT a dependency
# here. It is a regenerable, ephemeral artifact (clients/python), and making it
# an editable project dep means every `uv run` re-resolves it and fails whenever
# clients/python is absent -- so a plain `make test` would require generating the
# client first. Instead, `make test-integration` installs it for that run only
# via `uv run --with ./clients/python`. The integration suite imports it through
# pytest.importorskip and is skipped if it is not present.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default invocation excludes the integration suite (it requires a generated
# SDK and spawns a uvicorn subprocess). Run via `make test-integration` or
# `pytest -m integration tests/integration` (the trailing -m wins over the
# default below).
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not integration"]
markers = [
    "integration: requires the generated SDK + a spawned server (slow, opt-in)",
]

[tool.black]
line-length = 100
target-version = ["py313"]
# clients/python is fully machine-generated by openapi-generator; never format it.
extend-exclude = '''
/(
    clients/python
  | \.venv
)/
'''

[tool.pylint.main]
py-version = "3.13"
jobs = 1
ignore-paths = [
    "clients/python/.*",
]

[tool.pylint.format]
# Kept in lockstep with [tool.black].line-length.
max-line-length = 100

[tool.pylint."messages control"]
# Sensible defaults for a Pydantic/SQLModel/FastAPI codebase: silence false
# positives from model classes, route handlers, DI plumbing, and pytest fixtures.
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-return-statements",
    "too-many-ancestors",
    "duplicate-code",
    "abstract-method",          # TypeDecorator.python_type is intentionally unimplemented
    "no-member",                # SQLModel/SQLAlchemy descriptor magic confuses pylint
    "redefined-outer-name",     # pytest fixtures, FastAPI `lifespan(app: FastAPI)`
    "unused-argument",          # same: pytest fixtures + lifespan signature
    "use-dict-literal",         # stylistic; we sometimes prefer dict(**kwargs)
    "import-outside-toplevel",  # acceptable in tests for lazy/scoped imports
]

[tool.pylint.design]
max-args = 8

[tool.pylint.typecheck]
# SQLModel + SQLAlchemy generate a lot of dynamic attributes pylint can't see.
generated-members = [
    "sqlalchemy.*",
    "sqlmodel.*",
]

[tool.coverage.run]
branch = true
source = ["app"]
sigterm = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true

# Keep the mutation scope fixed so results can be compared across runs.
[tool.mutmut]
source_paths = ["app/"]
also_copy = [".claude/hooks/", "openapi.json"]
only_mutate = ["app/ledger.py", "app/routers/lineage.py", "app/routers/common.py", "app/nodes.py"]
pytest_add_cli_args_test_selection = ["tests/"]
max_stack_depth = -1
